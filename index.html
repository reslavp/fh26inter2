<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, viewport-fit=cover">
<title>Recherche de stand</title>
<style>
  :root{
    --bg: #F5F7F8;
    --surface: #FFFFFF;
    --text: #1B2430;
    --text-soft: #5B6472;
    --accent: #1E5F74;
    --accent-dark: #143F4E;
    --border: #E1E5E8;
    --badge-bg: #C1440E;
    --badge-text: #FFFFFF;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body{
    min-height: 100vh;
    display:flex;
    flex-direction: column;
    padding-bottom: 40px;
  }

  /* ---------- Ecran de verrouillage ---------- */
  #lockScreen{
    position: fixed;
    inset: 0;
    background: var(--accent-dark);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  #lockScreen.hidden{ display: none; }
  .lock-box{
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .lock-box h1{
    font-size: 1.15rem;
    margin: 0 0 6px;
  }
  .lock-box p{
    font-size: 0.85rem;
    color: rgba(255,255,255,0.75);
    margin: 0 0 18px;
  }
  .lock-box input{
    width: 100%;
    font-size: 16px;
    padding: 13px 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .lock-box input:focus{
    box-shadow: 0 0 0 3px rgba(255,255,255,0.35);
  }
  .lock-box button{
    width: 100%;
    margin-top: 12px;
    background: #fff;
    color: var(--accent-dark);
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .lock-error{
    color: #FFD5CC;
    font-size: 0.82rem;
    margin-top: 10px;
    min-height: 1.2em;
  }

  /* ---------- Contenu principal ---------- */
  #app.hidden{ display: none; }
  header{
    background: #000000;
    color: #fff;
    padding: 18px 18px 16px;
  }
  header h1{
    margin: 14px 0 0;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .header-badges{
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .header-badge{
    flex-shrink: 0;
    width: 72px;
    height: 72px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-text);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px 6px;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.1;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 2px 6px rgba(193,68,14,0.35);
    -webkit-tap-highlight-color: transparent;
  }
  .header-badge:active{ transform: scale(0.95); }
  .header-badge.active{
    background: #fff;
    color: var(--badge-bg);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.4);
  }
  .header-panel{
    margin-top: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.9rem;
  }
  .header-panel.hidden{ display: none; }
  .header-panel ul{
    margin: 0;
    padding-left: 18px;
  }
  .header-panel li{ margin-bottom: 4px; }
  .header-panel p.placeholder{
    margin: 0;
    color: rgba(255,255,255,0.7);
    font-style: italic;
  }
  .prog-tabs{
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .prog-tab{
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .prog-tab.active{
    background: #fff;
    color: #000;
  }
  .prog-list{
    max-height: 46vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .prog-item{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 9px 12px;
  }
  .prog-time{
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
  }
  .prog-scene{
    font-size: 0.76rem;
    color: rgba(255,255,255,0.65);
    margin-top: 2px;
  }
  .prog-artist{
    font-size: 0.98rem;
    font-weight: 800;
    margin-top: 3px;
  }
  .search-wrap{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .search-box{
    position: relative;
  }
  .search-box input{
    width: 100%;
    font-size: 16px;
    padding: 13px 40px 13px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }
  .search-box input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30,95,116,0.15);
  }
  .search-box button.clear{
    position:absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 20px;
    line-height: 1;
    padding: 8px;
    cursor: pointer;
    display: none;
  }
  .search-box.has-value button.clear{ display:block; }
  main{
    flex: 1;
    padding: 14px 16px 0;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  .count{
    font-size: 0.82rem;
    color: var(--text-soft);
    margin: 4px 2px 14px;
  }
  .list{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .card .main-info{ min-width: 0; }
  .card h2{
    margin: 0 0 8px;
    font-size: 1.05rem;
    font-weight: 700;
    word-break: break-word;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stand-name{
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: rgba(30,95,116,0.35);
    text-underline-offset: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  .stand-name:active{ opacity: 0.6; }
  .flag-badge{
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 6px;
    background: rgba(30,95,116,0.12);
    color: var(--accent-dark);
    font-size: 0.75rem;
    font-weight: 800;
  }
  .field-row{
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-size: 0.9rem;
    margin-bottom: 8px;
    color: var(--text);
  }
  .field-row .label{ color: var(--text-soft); font-weight: 700; }
  .field-row .value{ font-size: 0.95rem; }
  .badge{
    flex-shrink: 0;
    background: var(--badge-bg);
    color: var(--badge-text);
    border-radius: 999px;
    min-width: 76px;
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 4px 6px;
    box-shadow: 0 2px 6px rgba(193,68,14,0.35);
    border: none;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .badge:active{ transform: scale(0.95); }
  .badge:focus-visible{ outline: 3px solid var(--accent-dark); outline-offset: 2px; }
  .badge .num{ font-size: 1.9rem; font-weight: 800; line-height: 1; }
  .badge .tag{ font-size: 0.68rem; line-height: 1; margin-top: 4px; color: rgba(255,255,255,0.9); }
  .badge-col{
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .badge-secondary{
    width: 76px;
    height: 76px;
    min-width: 76px;
    background: var(--badge-bg);
    box-shadow: 0 2px 6px rgba(193,68,14,0.35);
  }
  .badge-secondary .num{ font-size: 1.9rem; }
  .badge-secondary .tag{ font-size: 0.68rem; }

  .filter-banner{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: rgba(30,95,116,0.1);
    border: 1px solid rgba(30,95,116,0.25);
    color: var(--accent-dark);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.88rem;
    margin-bottom: 12px;
  }
  .filter-banner strong{ font-weight: 800; }
  .filter-banner button{
    flex-shrink: 0;
    background: var(--accent-dark);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .empty{
    text-align: center;
    color: var(--text-soft);
    padding: 40px 16px;
    font-size: 0.95rem;
  }
  footer{
    max-width: 640px;
    margin: 24px auto 0;
    width: 100%;
    padding: 0 16px;
  }
  .footer-btn{
    width: 100%;
    background: transparent;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 0.85rem;
    color: var(--text-soft);
    cursor: pointer;
  }
  .footer-btn:active{ background: rgba(0,0,0,0.03); }
  .import-panel{
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .import-panel p{
    margin: 0 0 8px;
    font-size: 0.82rem;
    color: var(--text-soft);
    line-height: 1.4;
  }
  .import-panel textarea{
    width: 100%;
    min-height: 140px;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    resize: vertical;
  }
  .import-actions{
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn{
    font-size: 0.85rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary{ background: var(--accent); color: #fff; }
  .btn-secondary{ background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-danger{ background: transparent; color: #B23A2E; border: 1px solid #E7C6C1; }
  .status-msg{ font-size: 0.8rem; margin-top: 8px; }
  .status-msg.ok{ color: #1E7A45; }
  .status-msg.err{ color: #B23A2E; }
  :focus-visible{ outline: 3px solid var(--accent); outline-offset: 1px; }
  @media (min-width: 480px){ .card h2{ font-size: 1.1rem; } }

  /* ---------- Ajustements paysage (petits écrans) ---------- */
  @media (orientation: landscape) and (max-height: 500px){
    header{ padding: 12px 18px 10px; }
    header h1{ font-size: 1.1rem; margin-bottom: 2px; }
    header p{ font-size: 0.8rem; }
    .search-wrap{ padding: 10px 16px 8px; }
    main{ max-width: 900px; }
    .list{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .card{ padding: 10px 12px; }
    .badge, .badge-secondary{ width: 60px; height: 60px; min-width: 60px; }
    .badge .num{ font-size: 1.4rem; }
    footer{ max-width: 900px; }
  }  .plan-overlay{
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 200;
  }
  .plan-overlay.hidden{ display: none; }
  .plan-scroll{
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .plan-stage{
    position: relative;
    display: inline-block;
    max-width: 100%;
    max-height: 100%;
    transform-origin: 0 0;
    will-change: transform;
  }
  .plan-img{
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    margin: auto;
    -webkit-user-drag: none;
    user-select: none;
  }
  .stand-marker{
    position: absolute;
    width: 64px;
    height: 64px;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
    border: 6px solid #E11D2A;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.85), 0 0 14px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .stand-highlight{
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    background: rgba(247, 255, 0, 0.75);
    mix-blend-mode: multiply;
    outline: 2px solid rgba(180, 160, 0, 0.9);
    border-radius: 3px;
    pointer-events: none;
  }
  .plan-close{
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 201;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: none;
    background: rgba(255,255,255,0.9);
    color: #000;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="planOverlay" class="plan-overlay hidden">
  <button type="button" class="plan-close" onclick="closePlanOverlay()" aria-label="Fermer le plan">×</button>
  <div class="plan-scroll">
    <div class="plan-stage">
      <img src="plan.jpg" alt="Plan général du site" class="plan-img">
      <div class="stand-marker" id="standMarker" style="display:none;"></div>
      <div class="stand-highlight" id="standHighlight" style="display:none;"></div>
    </div>
  </div>
</div>

<div id="lockScreen">
  <div class="lock-box">
    <h1>Accès protégé</h1>
    <p>Entrez le mot de passe pour consulter la liste. Il ne sera demandé qu'une seule fois sur cet appareil.</p>
    <label for="passwordInput" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Mot de passe</label>
    <input id="passwordInput" type="password" inputmode="text" autocomplete="off" placeholder="Mot de passe">
    <button id="unlockBtn">Valider</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="header-badges">
      <button type="button" class="header-badge" id="hb-left" onclick="openPlanImage()">Plan</button>
      <button type="button" class="header-badge" id="hb-middle" onclick="toggleHeaderPanel('middle')">Prog</button>
      <button type="button" class="header-badge" id="hb-numeros" onclick="toggleHeaderPanel('numeros')">Numéros</button>
    </div>
    <h1>AS Central</h1>
    <div class="header-panel hidden" id="headerPanel"></div>
  </header>

  <div class="search-wrap">
    <div class="search-box" id="searchBox">
      <label for="searchInput" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Rechercher un stand</label>
      <input id="searchInput" type="text" inputmode="search" autocomplete="off" placeholder="Rechercher Nom du stand / Rue / Zone">
      <button class="clear" id="clearBtn" aria-label="Effacer la recherche">×</button>
    </div>
  </div>

  <main>
    <div class="count" id="countMsg" aria-live="polite"></div>
    <div class="list" id="list"></div>
  </main>

</div>

<script>
  /* ---------- Mot de passe ---------- */
  const PASSWORD = "central26";
  const UNLOCK_KEY = "stands_unlocked_v2";

  const lockScreen = document.getElementById("lockScreen");
  const appEl = document.getElementById("app");
  const passwordInput = document.getElementById("passwordInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const lockError = document.getElementById("lockError");

  function tryUnlock(){
    if (passwordInput.value === PASSWORD){
      try { localStorage.setItem(UNLOCK_KEY, "1"); } catch(e){}
      showApp();
    } else {
      lockError.textContent = "Mot de passe incorrect.";
      passwordInput.value = "";
      passwordInput.focus();
    }
  }

  function showApp(){
    lockScreen.classList.add("hidden");
    appEl.classList.remove("hidden");
    render();
  }

  unlockBtn.addEventListener("click", tryUnlock);
  passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

  let alreadyUnlocked = false;
  try { alreadyUnlocked = localStorage.getItem(UNLOCK_KEY) === "1"; } catch(e){}

  /* ---------- Données des stands ----------
     La liste est fixée dans le code ci-dessous. Les visiteurs ne peuvent
     ni la modifier ni la mettre à jour depuis la page. Pour changer les

     redéployer sur l'hébergement. */

    { stand: "Les Inverties", flag: "", rue: "Avenue Bobby Sands", pompier: "13", pompier2: "", zone: "Entrée publique NO", pedestrian: "Rue Entrée publique NO - Jack Ralite" },
    { stand: "NPA", flag: "X", rue: "Avenue Bobby Sands", pompier: "12", pompier2: "", zone: "Entrée publique NO", pedestrian: "Rue Entrée publique NO - Jack Ralite" },

  function normalize(str){
    return (str || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  }

  function escapeHtml(str){
    return (str || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function escapeJsArg(str){
    return (str || "").toString()
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  function cardHTML(d){
    const flagBadge = d.flag
      ? `<span class="flag-badge" title="Marqueur">${escapeHtml(d.flag)}</span>`
      : "";
    return `
      <div class="card">
        <div class="main-info">
          <h2><span class="stand-name" role="button" tabindex="0" onclick="zoomToStand('${escapeJsArg(d.stand)}','${escapeJsArg(d.rue)}')" onkeydown="if(event.key==='Enter')zoomToStand('${escapeJsArg(d.stand)}','${escapeJsArg(d.rue)}')">${escapeHtml(d.stand)}</span>${flagBadge}</h2>
          <div class="field-row"><span class="label">Rue / Place</span><span class="value">${escapeHtml(d.rue)}</span></div>
          <div class="field-row"><span class="label">Zone</span><span class="value">${escapeHtml(d.zone)}</span></div>
          ${d.pedestrian ? `<div class="field-row" style="margin-bottom:0;"><span class="label">Zonage piéton</span><span class="value">${escapeHtml(d.pedestrian)}</span></div>` : ""}
        </div>
        <div class="badge-col">
          <button type="button" class="badge" onclick="filterByPompier('${escapeHtml(d.pompier)}')" aria-label="Voir uniquement les stands du poste pompier ${escapeHtml(d.pompier)}">
            <div class="num">${escapeHtml(d.pompier)}</div>
            <div class="tag">pompier</div>
          </button>
          ${d.pompier2 ? `
          <button type="button" class="badge badge-secondary" onclick="filterByPompier('${escapeHtml(d.pompier2)}')" aria-label="Voir uniquement les stands du poste pompier ${escapeHtml(d.pompier2)}">
            <div class="num">${escapeHtml(d.pompier2)}</div>
            <div class="tag">pompier 2</div>
          </button>` : ""}
        </div>
      </div>
    `;
  }

  function render(){
    const q = normalize(searchInput.value);
    searchBox.classList.toggle("has-value", searchInput.value.length > 0);

    const base = activeFilter ? data.filter(d => d.pompier === activeFilter || d.pompier2 === activeFilter) : data;
    const filtered = q
      ? base.filter(d => normalize(d.stand + " " + d.rue + " " + d.pompier + " " + d.zone + " " + (d.pedestrian || "") + " " + (d.flag || "")).includes(q))
      : base;

    document.querySelector(".empty")?.remove();
    document.querySelector(".filter-banner")?.remove();

    if (activeFilter){
      const banner = document.createElement("div");
      banner.className = "filter-banner";
      banner.innerHTML = `<span>Poste pompier <strong>${escapeHtml(activeFilter)}</strong> — ${base.length} stand${base.length > 1 ? "s" : ""}</span><button type="button" onclick="clearFilter()">Voir tout</button>`;
      countEl.insertAdjacentElement("beforebegin", banner);
    }

    if (filtered.length === 0){
      listEl.innerHTML = "";
      countEl.textContent = "";
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = q
        ? `Aucun stand ne correspond à « ${searchInput.value.trim()} ».`
        : "Aucune donnée pour le moment.";
      mainEl.appendChild(empty);
      return;
    }

    countEl.textContent = q
      ? `${filtered.length} résultat${filtered.length > 1 ? "s" : ""}`
      : `${filtered.length} stands au total`;
    listEl.innerHTML = filtered.map(cardHTML).join("");
  }

  function zoomToStand(stand, rue){
    const box = NORMALIZED_STAND_COORDS[normalize(stand)];
    if (box){
      const cx = (box.x0 + box.x1) / 2;
      const cy = (box.top + box.bottom) / 2;
      openPlanImage(cx, cy, box);
      return;
    }
    const rueCoord = NORMALIZED_RUE_COORDS[normalize(rue)];
    if (rueCoord){
      openPlanImage(rueCoord.x, rueCoord.y, null);
    } else {
      openPlanImage();
    }
  }

  function updatePlanCloseButtonPosition(){
    const btn = document.querySelector(".plan-close");
    const overlay = document.getElementById("planOverlay");
    if (!btn || overlay.classList.contains("hidden")) return;
    const vv = window.visualViewport;
    if (vv){
      const top = vv.offsetTop + 12;
      const right = (window.innerWidth - (vv.offsetLeft + vv.width)) + 12;
      btn.style.top = top + "px";
      btn.style.right = right + "px";
    }
  }

  if (window.visualViewport){
    window.visualViewport.addEventListener("resize", updatePlanCloseButtonPosition);
    window.visualViewport.addEventListener("scroll", updatePlanCloseButtonPosition);
  }

  function openPlanImage(fx, fy, box){
    const overlay = document.getElementById("planOverlay");
    const marker = document.getElementById("standMarker");
    const highlight = document.getElementById("standHighlight");
    overlay.classList.remove("hidden");
    updatePlanCloseButtonPosition();
    resetPlanTransform();
    initPlanGestures();

    if (typeof fx === "number" && typeof fy === "number"){
      marker.style.left = (fx * 100) + "%";
      marker.style.top = (fy * 100) + "%";
      marker.style.display = "block";
    } else {
      marker.style.display = "none";
    }

    if (box){
      const pad = 0.0025;
      highlight.style.left = ((box.x0 - pad) * 100) + "%";
      highlight.style.top = ((box.top - pad) * 100) + "%";
      highlight.style.width = ((box.x1 - box.x0 + pad * 2) * 100) + "%";
      highlight.style.height = ((box.bottom - box.top + pad * 2) * 100) + "%";
      highlight.style.display = "block";
    } else {
      highlight.style.display = "none";
    }
  }

  function closePlanOverlay(){
    document.getElementById("standMarker").style.display = "none";
    document.getElementById("standHighlight").style.display = "none";
    document.getElementById("planOverlay").classList.add("hidden");
    const btn = document.querySelector(".plan-close");
    if (btn){ btn.style.top = ""; btn.style.right = ""; }
    resetPlanTransform();
  }

  /* ---------- Pinch-zoom / pan manuel (le bouton fermer garde une taille fixe) ---------- */
  let planScale = 1, planX = 0, planY = 0;
  let planBaseRect = null; // rect du plan quand scale=1, translate=0 (mesuré une fois à l'ouverture)
  const PLAN_MIN_SCALE = 1, PLAN_MAX_SCALE = 6;
  let planGesture = null;

  function resetPlanTransform(){
    planScale = 1; planX = 0; planY = 0;
    applyPlanTransform();
    requestAnimationFrame(() => {
      const stage = document.querySelector(".plan-stage");
      if (stage) planBaseRect = stage.getBoundingClientRect();
    });
  }

  function applyPlanTransform(){
    const stage = document.querySelector(".plan-stage");
    if (stage){
      stage.style.transform = `translate(${planX}px, ${planY}px) scale(${planScale})`;
    }
  }

  function clampPlanPan(){
    const scrollEl = document.querySelector(".plan-scroll");
    if (!scrollEl || !planBaseRect) return;
    const scaledW = planBaseRect.width * planScale;
    const scaledH = planBaseRect.height * planScale;
    const viewW = scrollEl.clientWidth, viewH = scrollEl.clientHeight;
    if (scaledW <= viewW){
      planX = (viewW - scaledW) / 2 - planBaseRect.left;
    } else {
      const minX = viewW - planBaseRect.left - scaledW;
      const maxX = -planBaseRect.left;
      planX = Math.max(minX, Math.min(maxX, planX));
    }
    if (scaledH <= viewH){
      planY = (viewH - scaledH) / 2 - planBaseRect.top;
    } else {
      const minY = viewH - planBaseRect.top - scaledH;
      const maxY = -planBaseRect.top;
      planY = Math.max(minY, Math.min(maxY, planY));
    }
  }

  function touchDist(t0, t1){
    return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  }
  function touchMid(t0, t1){
    return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
  }

  function initPlanGestures(){
    const scrollEl = document.querySelector(".plan-scroll");
    if (!scrollEl || scrollEl.dataset.gesturesBound) return;
    scrollEl.dataset.gesturesBound = "1";

    scrollEl.addEventListener("touchstart", (e) => {
      if (!planBaseRect) return;
      if (e.touches.length === 2){
        const mid = touchMid(e.touches[0], e.touches[1]);
        planGesture = {
          mode: "pinch",
          startDist: touchDist(e.touches[0], e.touches[1]),
          startScale: planScale,
          // point local (dans le repère non transformé du plan) sous le doigt
          localX: (mid.x - planBaseRect.left - planX) / planScale,
          localY: (mid.y - planBaseRect.top - planY) / planScale
        };
      } else if (e.touches.length === 1){
        planGesture = {
          mode: "pan",
          startX: planX, startY: planY,
          startPointX: e.touches[0].clientX,
          startPointY: e.touches[0].clientY
        };
      }
    }, { passive: true });

    scrollEl.addEventListener("touchmove", (e) => {
      if (!planGesture || !planBaseRect) return;
      e.preventDefault();
      if (planGesture.mode === "pinch" && e.touches.length === 2){
        const dist = touchDist(e.touches[0], e.touches[1]);
        const ratio = dist / planGesture.startDist;
        planScale = Math.max(PLAN_MIN_SCALE, Math.min(PLAN_MAX_SCALE, planGesture.startScale * ratio));
        const mid = touchMid(e.touches[0], e.touches[1]);
        planX = mid.x - planBaseRect.left - planGesture.localX * planScale;
        planY = mid.y - planBaseRect.top - planGesture.localY * planScale;
        clampPlanPan();
        applyPlanTransform();
      } else if (planGesture.mode === "pan" && e.touches.length === 1){
        planX = planGesture.startX + (e.touches[0].clientX - planGesture.startPointX);
        planY = planGesture.startY + (e.touches[0].clientY - planGesture.startPointY);
        clampPlanPan();
        applyPlanTransform();
      }
    }, { passive: false });

    scrollEl.addEventListener("touchend", (e) => {
      if (e.touches.length === 0){
        planGesture = null;
      } else if (e.touches.length === 1){
        planGesture = {
          mode: "pan",
          startX: planX, startY: planY,
          startPointX: e.touches[0].clientX,
          startPointY: e.touches[0].clientY
        };
      }
    }, { passive: true });
  }

  function toggleHeaderPanel(key){
    if (openHeaderBadge === key){
      openHeaderBadge = null;
    } else {
      openHeaderBadge = key;
    }
    Object.entries(HEADER_BADGE_IDS).forEach(([k, id]) => {
      document.getElementById(id).classList.toggle("active", k === openHeaderBadge);
    });
    if (!openHeaderBadge){
      headerPanel.classList.add("hidden");
      headerPanel.innerHTML = "";
      return;
    }
    headerPanel.innerHTML = renderHeaderPanelContent(openHeaderBadge);
    headerPanel.classList.remove("hidden");
  }

  searchInput.addEventListener("input", render);
  clearBtn.addEventListener("click", () => { searchInput.value = ""; render(); searchInput.focus(); });

  /* ---------- Démarrage ---------- */
  if (alreadyUnlocked){
    showApp();
  } else {
    passwordInput.focus();
  }
</script>
