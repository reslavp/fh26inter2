<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, viewport-fit=cover">
<title>Recherche de stand</title>
<style>
  :root{
    --bg: #F5F7F8;
    --surface: #FFFFFF;
    --text: #1B2430;
    --text-soft: #5B6472;
    --accent: #1E5F74;
    --accent-dark: #143F4E;
    --border: #E1E5E8;
    --badge-bg: #C1440E;
    --badge-text: #FFFFFF;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body{
    min-height: 100vh;
    display:flex;
    flex-direction: column;
    padding-bottom: 40px;
  }

  /* ---------- Ecran de verrouillage ---------- */
  #lockScreen{
    position: fixed;
    inset: 0;
    background: var(--accent-dark);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  #lockScreen.hidden{ display: none; }
  .lock-box{
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .lock-box h1{
    font-size: 1.15rem;
    margin: 0 0 6px;
  }
  .lock-box p{
    font-size: 0.85rem;
    color: rgba(255,255,255,0.75);
    margin: 0 0 18px;
  }
  .lock-box input{
    width: 100%;
    font-size: 16px;
    padding: 13px 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .lock-box input:focus{
    box-shadow: 0 0 0 3px rgba(255,255,255,0.35);
  }
  .lock-box button{
    width: 100%;
    margin-top: 12px;
    background: #fff;
    color: var(--accent-dark);
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .lock-error{
    color: #FFD5CC;
    font-size: 0.82rem;
    margin-top: 10px;
    min-height: 1.2em;
  }

  /* ---------- Contenu principal ---------- */
  #app.hidden{ display: none; }
  header{
    background: #000000;
    color: #fff;
    padding: 18px 18px 16px;
  }
  header h1{
    margin: 14px 0 0;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .header-badges{
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .header-badge{
    flex-shrink: 0;
    width: 72px;
    height: 72px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-text);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px 6px;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.1;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 2px 6px rgba(193,68,14,0.35);
    -webkit-tap-highlight-color: transparent;
  }
  .header-badge:active{ transform: scale(0.95); }
  .header-badge.active{
    background: #fff;
    color: var(--badge-bg);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.4);
  }
  .header-panel{
    margin-top: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.9rem;
  }
  .header-panel.hidden{ display: none; }
  .header-panel ul{
    margin: 0;
    padding-left: 18px;
  }
  .header-panel li{ margin-bottom: 4px; }
  .header-panel p.placeholder{
    margin: 0;
    color: rgba(255,255,255,0.7);
    font-style: italic;
  }
  .prog-tabs{
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .prog-tab{
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .prog-tab.active{
    background: #fff;
    color: #000;
  }
  .prog-list{
    max-height: 46vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .prog-item{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 9px 12px;
  }
  .prog-time{
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
  }
  .prog-scene{
    font-size: 0.76rem;
    color: rgba(255,255,255,0.65);
    margin-top: 2px;
  }
  .prog-artist{
    font-size: 0.98rem;
    font-weight: 800;
    margin-top: 3px;
  }
  .search-wrap{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .search-box{
    position: relative;
  }
  .search-box input{
    width: 100%;
    font-size: 16px;
    padding: 13px 40px 13px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }
  .search-box input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30,95,116,0.15);
  }
  .search-box button.clear{
    position:absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 20px;
    line-height: 1;
    padding: 8px;
    cursor: pointer;
    display: none;
  }
  .search-box.has-value button.clear{ display:block; }
  main{
    flex: 1;
    padding: 14px 16px 0;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  .count{
    font-size: 0.82rem;
    color: var(--text-soft);
    margin: 4px 2px 14px;
  }
  .list{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .card .main-info{ min-width: 0; }
  .card h2{
    margin: 0 0 8px;
    font-size: 1.05rem;
    font-weight: 700;
    word-break: break-word;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .flag-badge{
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 6px;
    background: rgba(30,95,116,0.12);
    color: var(--accent-dark);
    font-size: 0.75rem;
    font-weight: 800;
  }
  .field-row{
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-size: 0.9rem;
    margin-bottom: 8px;
    color: var(--text);
  }
  .field-row .label{ color: var(--text-soft); font-weight: 700; }
  .field-row .value{ font-size: 0.95rem; }
  .badge{
    flex-shrink: 0;
    background: var(--badge-bg);
    color: var(--badge-text);
    border-radius: 999px;
    min-width: 76px;
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 4px 6px;
    box-shadow: 0 2px 6px rgba(193,68,14,0.35);
    border: none;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .badge:active{ transform: scale(0.95); }
  .badge:focus-visible{ outline: 3px solid var(--accent-dark); outline-offset: 2px; }
  .badge .num{ font-size: 1.9rem; font-weight: 800; line-height: 1; }
  .badge .tag{ font-size: 0.68rem; line-height: 1; margin-top: 4px; color: rgba(255,255,255,0.9); }

  .filter-banner{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: rgba(30,95,116,0.1);
    border: 1px solid rgba(30,95,116,0.25);
    color: var(--accent-dark);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.88rem;
    margin-bottom: 12px;
  }
  .filter-banner strong{ font-weight: 800; }
  .filter-banner button{
    flex-shrink: 0;
    background: var(--accent-dark);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .empty{
    text-align: center;
    color: var(--text-soft);
    padding: 40px 16px;
    font-size: 0.95rem;
  }
  footer{
    max-width: 640px;
    margin: 24px auto 0;
    width: 100%;
    padding: 0 16px;
  }
  .footer-btn{
    width: 100%;
    background: transparent;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 0.85rem;
    color: var(--text-soft);
    cursor: pointer;
  }
  .footer-btn:active{ background: rgba(0,0,0,0.03); }
  .import-panel{
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .import-panel p{
    margin: 0 0 8px;
    font-size: 0.82rem;
    color: var(--text-soft);
    line-height: 1.4;
  }
  .import-panel textarea{
    width: 100%;
    min-height: 140px;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    resize: vertical;
  }
  .import-actions{
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn{
    font-size: 0.85rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary{ background: var(--accent); color: #fff; }
  .btn-secondary{ background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-danger{ background: transparent; color: #B23A2E; border: 1px solid #E7C6C1; }
  .status-msg{ font-size: 0.8rem; margin-top: 8px; }
  .status-msg.ok{ color: #1E7A45; }
  .status-msg.err{ color: #B23A2E; }
  :focus-visible{ outline: 3px solid var(--accent); outline-offset: 1px; }
  @media (min-width: 480px){ .card h2{ font-size: 1.1rem; } }

  /* ---------- Ajustements paysage (petits écrans) ---------- */
  @media (orientation: landscape) and (max-height: 500px){
    header{ padding: 12px 18px 10px; }
    header h1{ font-size: 1.1rem; margin-bottom: 2px; }
    header p{ font-size: 0.8rem; }
    .search-wrap{ padding: 10px 16px 8px; }
    main{ max-width: 900px; }
    .list{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .card{ padding: 10px 12px; }
    .badge{ width: 60px; height: 60px; min-width: 60px; }
    .badge .num{ font-size: 1.4rem; }
    footer{ max-width: 900px; }
  }  .plan-overlay{
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 200;
  }
  .plan-overlay.hidden{ display: none; }
  .plan-scroll{
    width: 100%;
    height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pinch-zoom pan-x pan-y;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .plan-img{
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    margin: auto;
  }
  .plan-close{
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 201;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: none;
    background: rgba(255,255,255,0.9);
    color: #000;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="planOverlay" class="plan-overlay hidden">
  <button type="button" class="plan-close" onclick="closePlanOverlay()" aria-label="Fermer le plan">×</button>
  <div class="plan-scroll">
    <img src="plan.jpg" alt="Plan général du site" class="plan-img">
  </div>
</div>

<div id="lockScreen">
  <div class="lock-box">
    <h1>Accès protégé</h1>
    <p>Entrez le mot de passe pour consulter la liste. Il ne sera demandé qu'une seule fois sur cet appareil.</p>
    <label for="passwordInput" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Mot de passe</label>
    <input id="passwordInput" type="password" inputmode="text" autocomplete="off" placeholder="Mot de passe">
    <button id="unlockBtn">Valider</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="header-badges">
      <button type="button" class="header-badge" id="hb-left" onclick="openPlanImage()">Plan</button>
      <button type="button" class="header-badge" id="hb-middle" onclick="toggleHeaderPanel('middle')">Prog</button>
      <button type="button" class="header-badge" id="hb-numeros" onclick="toggleHeaderPanel('numeros')">Numéros</button>
    </div>
    <h1>AS Central</h1>
    <div class="header-panel hidden" id="headerPanel"></div>
  </header>

  <div class="search-wrap">
    <div class="search-box" id="searchBox">
      <label for="searchInput" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Rechercher un stand</label>
      <input id="searchInput" type="text" inputmode="search" autocomplete="off" placeholder="Rechercher Nom du stand / Rue / Zone">
      <button class="clear" id="clearBtn" aria-label="Effacer la recherche">×</button>
    </div>
  </div>

  <main>
    <div class="count" id="countMsg" aria-live="polite"></div>
    <div class="list" id="list"></div>
  </main>

</div>

<script>
  /* ---------- Mot de passe ---------- */
  const PASSWORD = "inter2";
  const UNLOCK_KEY = "stands_unlocked_v1";

  const lockScreen = document.getElementById("lockScreen");
  const appEl = document.getElementById("app");
  const passwordInput = document.getElementById("passwordInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const lockError = document.getElementById("lockError");

  function tryUnlock(){
    if (passwordInput.value === PASSWORD){
      try { localStorage.setItem(UNLOCK_KEY, "1"); } catch(e){}
      showApp();
    } else {
      lockError.textContent = "Mot de passe incorrect.";
      passwordInput.value = "";
      passwordInput.focus();
    }
  }

  function showApp(){
    lockScreen.classList.add("hidden");
    appEl.classList.remove("hidden");
    render();
  }

  unlockBtn.addEventListener("click", tryUnlock);
  passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

  let alreadyUnlocked = false;
  try { alreadyUnlocked = localStorage.getItem(UNLOCK_KEY) === "1"; } catch(e){}

  const listEl = document.getElementById("list");

  const mainEl = document.querySelector("main");

  function normalize(str){
    return (str || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  }

  function escapeHtml(str){
    return (str || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function cardHTML(d){
    const flagBadge = d.flag
      ? `<span class="flag-badge" title="Marqueur">${escapeHtml(d.flag)}</span>`
      : "";
    return `
      <div class="card">
        <div class="main-info">
          <h2><span>${escapeHtml(d.stand)}</span>${flagBadge}</h2>
          <div class="field-row"><span class="label">Rue / Place</span><span class="value">${escapeHtml(d.rue)}</span></div>
          <div class="field-row"><span class="label">Zone</span><span class="value">${escapeHtml(d.zone)}</span></div>
          ${d.pedestrian ? `<div class="field-row" style="margin-bottom:0;"><span class="label">Zonage piéton</span><span class="value">${escapeHtml(d.pedestrian)}</span></div>` : ""}
        </div>
        <button type="button" class="badge" onclick="filterByPompier('${escapeHtml(d.pompier)}')" aria-label="Voir uniquement les stands du poste pompier ${escapeHtml(d.pompier)}">
          <div class="num">${escapeHtml(d.pompier)}</div>
          <div class="tag">pompier</div>
        </button>
      </div>
    `;
  }

  function render(){
    const q = normalize(searchInput.value);
    searchBox.classList.toggle("has-value", searchInput.value.length > 0);

    const base = activeFilter ? data.filter(d => d.pompier === activeFilter) : data;
    const filtered = q
      ? base.filter(d => normalize(d.stand + " " + d.rue + " " + d.pompier + " " + d.zone + " " + (d.pedestrian || "") + " " + (d.flag || "")).includes(q))
      : base;

    document.querySelector(".empty")?.remove();
    document.querySelector(".filter-banner")?.remove();

    if (activeFilter){
      const banner = document.createElement("div");
      banner.className = "filter-banner";
      banner.innerHTML = `<span>Poste pompier <strong>${escapeHtml(activeFilter)}</strong> — ${base.length} stand${base.length > 1 ? "s" : ""}</span><button type="button" onclick="clearFilter()">Voir tout</button>`;
      countEl.insertAdjacentElement("beforebegin", banner);
    }

    if (filtered.length === 0){
      listEl.innerHTML = "";
      countEl.textContent = "";
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = q
        ? `Aucun stand ne correspond à « ${searchInput.value.trim()} ».`
        : "Aucune donnée pour le moment.";
      mainEl.appendChild(empty);
      return;
    }

    countEl.textContent = q
      ? `${filtered.length} résultat${filtered.length > 1 ? "s" : ""}`
      : `${filtered.length} stands au total`;
    listEl.innerHTML = filtered.map(cardHTML).join("");
  }

  function filterByPompier(num){
    activeFilter = num;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function clearFilter(){
    activeFilter = null;
    render();
  }

  }

  let progActiveDay = "Vendredi";

  function setProgDay(day){
    progActiveDay = day;
    headerPanel.innerHTML = renderHeaderPanelContent("middle");
  }

  function renderProgPanel(){
    const items = PROG_DATA
      .filter(e => e.day === progActiveDay)
      .sort((a, b) => progSortKey(a.start) - progSortKey(b.start));

    const tabs = PROG_DAYS.map(d => `
      <button type="button" class="prog-tab${d === progActiveDay ? " active" : ""}" onclick="setProgDay('${d}')">${d}</button>
    `).join("");

    const list = items.map(e => `
      <div class="prog-item">
        <div class="prog-time">${escapeHtml(e.start)} - ${escapeHtml(e.end)}</div>
        <div class="prog-scene">Scène ${escapeHtml(e.stage)}</div>
        <div class="prog-artist">${escapeHtml(e.name)}</div>
      </div>
    `).join("");

    return `<div class="prog-tabs">${tabs}</div><div class="prog-list">${list}</div>`;
  }

  function renderHeaderPanelContent(key){
    if (key === "middle"){
      return renderProgPanel();
    }
    const items = HEADER_BADGE_CONTENT[key];
    return (items && items.length)
      ? `<ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>`
      : `<p class="placeholder">Contenu à venir.</p>`;
  }

  function openPlanImage(){
    document.getElementById("planOverlay").classList.remove("hidden");
  }

  function closePlanOverlay(){
    document.getElementById("planOverlay").classList.add("hidden");
  }

  function toggleHeaderPanel(key){
    if (openHeaderBadge === key){
      openHeaderBadge = null;
    } else {
      openHeaderBadge = key;
    }
    Object.entries(HEADER_BADGE_IDS).forEach(([k, id]) => {
      document.getElementById(id).classList.toggle("active", k === openHeaderBadge);
    });
    if (!openHeaderBadge){
      headerPanel.classList.add("hidden");
      headerPanel.innerHTML = "";
      return;
    }
    headerPanel.innerHTML = renderHeaderPanelContent(openHeaderBadge);
    headerPanel.classList.remove("hidden");
  }

  searchInput.addEventListener("input", render);
  clearBtn.addEventListener("click", () => { searchInput.value = ""; render(); searchInput.focus(); });

  /* ---------- Démarrage ---------- */
  if (alreadyUnlocked){
    showApp();
  } else {
    passwordInput.focus();
  }
</script>

</body>
</html>
